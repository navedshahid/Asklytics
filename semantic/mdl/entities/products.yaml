name: products
grain: product_id
description: Product catalog with category and pricing
reference:
  table: products
columns:
  - { name: product_id, dtype: integer, primary: true, description: "Product primary key" }
  - { name: sku, dtype: string, description: "Stock keeping unit code" }
  - { name: product_name, dtype: string, description: "Product display name" }
  - { name: category, dtype: string, description: "Product category" }
  - { name: subcategory, dtype: string, description: "Product subcategory" }
  - { name: list_price, dtype: decimal, description: "Current list price" }
  - { name: cost, dtype: decimal, description: "Product cost" }
  - { name: is_active, dtype: boolean, description: "Whether product is currently sold" }
properties:
  default_filters:
    - "is_active = 1"
tags:
  - master_data
  - product


