name: order_items
grain: order_item_id
description: Line items for each order with product details
reference:
  table: order_items
columns:
  - { name: order_item_id, dtype: integer, primary: true, description: "Order item primary key" }
  - { name: order_id, dtype: integer, description: "Foreign key to orders" }
  - { name: product_id, dtype: integer, description: "Foreign key to products" }
  - { name: quantity, dtype: integer, description: "Quantity ordered" }
  - { name: unit_price, dtype: decimal, description: "Price per unit at time of order" }
  - { name: discount, dtype: decimal, description: "Discount applied to this line" }
  - { name: extended_price, dtype: decimal, description: "quantity * unit_price - discount" }
properties:
  default_filters: []
tags:
  - transactional
  - order
  - line_item


