name: customers
grain: customer_id
description: Customer master table with contact information
reference:
  table: customers
columns:
  - { name: customer_id, dtype: integer, primary: true, description: "Customer primary key" }
  - { name: email, dtype: string, pii: true, description: "Customer email address" }
  - { name: first_name, dtype: string, pii: true, description: "Customer first name" }
  - { name: last_name, dtype: string, pii: true, description: "Customer last name" }
  - { name: phone, dtype: string, pii: true, description: "Customer phone number" }
  - { name: city, dtype: string, description: "Customer city" }
  - { name: state, dtype: string, description: "Customer state" }
  - { name: country, dtype: string, description: "Customer country" }
  - { name: created_at, dtype: timestamp, description: "Customer registration date" }
properties:
  default_time_col: created_at
tags:
  - customer
  - master_data


