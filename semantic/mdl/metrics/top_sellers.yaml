name: top_sellers
entity: products
grain: [product]
description: Products ranked by total quantity sold
sql: |
  SELECT
    p.product_id,
    p.product_name,
    p.category,
    SUM(oi.quantity) AS units_sold,
    SUM(oi.extended_price) AS total_revenue
  FROM order_items oi
  JOIN orders o ON oi.order_id = o.order_id
  JOIN products p ON oi.product_id = p.product_id
  WHERE o.order_date BETWEEN :start_date AND :end_date
    AND o.status = 'completed'
    {{AND_FILTERS}}
  GROUP BY p.product_id, p.product_name, p.category
  ORDER BY units_sold DESC
  LIMIT :top_n
filters:
  category: "p.category = :category"
  store: "o.store_id = :store"
lineage:
  - { table: "products", column: "product_name" }
  - { table: "order_items", column: "quantity" }
  - { table: "order_items", column: "extended_price" }
examples:
  - "What are our top 10 selling products?"
  - "Best sellers in electronics category"
  - "Most popular products this quarter"
tags:
  - product
  - ranking
  - sales


