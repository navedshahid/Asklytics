name: customer_ltv
entity: customers
grain: [customer]
description: Customer lifetime value - total revenue per customer
sql: |
  SELECT
    c.customer_id,
    c.first_name,
    c.last_name,
    COUNT(DISTINCT o.order_id) AS order_count,
    SUM(o.total_amount) AS lifetime_value,
    MIN(o.order_date) AS first_order_date,
    MAX(o.order_date) AS last_order_date
  FROM customers c
  LEFT JOIN orders o ON c.customer_id = o.customer_id
  WHERE 1=1
    {{AND_FILTERS}}
  GROUP BY c.customer_id, c.first_name, c.last_name
  ORDER BY lifetime_value DESC
  LIMIT :top_n
filters:
  min_orders: "HAVING COUNT(DISTINCT o.order_id) >= :min_orders"
  state: "c.state = :state"
lineage:
  - { table: "customers", column: "customer_id" }
  - { table: "orders", column: "total_amount" }
  - { table: "orders", column: "order_date" }
examples:
  - "Who are our top 20 customers by revenue?"
  - "Customers with lifetime value over $10,000"
  - "Most valuable customers in California"
tags:
  - customer
  - revenue
  - ltv


