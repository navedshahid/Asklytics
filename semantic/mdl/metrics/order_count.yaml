name: order_count
entity: orders
grain: [day, store]
description: Count of distinct orders
sql: |
  SELECT
    DATE(o.order_date) AS day,
    o.store_id,
    COUNT(DISTINCT o.order_id) AS order_count
  FROM orders o
  WHERE o.order_date BETWEEN :start_date AND :end_date
    AND o.status != 'cancelled'
    {{AND_FILTERS}}
  GROUP BY DATE(o.order_date), o.store_id
filters:
  store: "o.store_id = :store"
  status: "o.status = :status"
lineage:
  - { table: "orders", column: "order_id" }
  - { table: "orders", column: "order_date" }
  - { table: "orders", column: "store_id" }
examples:
  - "How many orders did we have yesterday?"
  - "Count of orders by store this week"
  - "Daily order volume"
tags:
  - orders
  - volume


