<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings - Analytica AI</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/feather-icons"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fa;
            color: #212529;
        }

        .container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 2rem;
            background-color: white;
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: #495057;
        }

        .form-input {
            width: 100%;
            padding: 0.625rem 0.875rem;
            border: 1px solid #ced4da;
            border-radius: 0.375rem;
            font-size: 0.9375rem;
            transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
        }

        .form-input:focus {
            border-color: #86b7fe;
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
            outline: 0;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.625rem 1.25rem;
            border-radius: 0.375rem;
            font-weight: 500;
            transition: background-color 0.2s ease-in-out;
            border: none;
            cursor: pointer;
        }

        .btn-primary {
            background-color: #0d6efd;
            color: white;
        }

        .btn-primary:hover {
            background-color: #0b5ed7;
        }

        .btn-secondary {
            background-color: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background-color: #5a6268;
        }

        .btn-success {
            background-color: #198754;
            color: white;
        }

        .btn-success:hover {
            background-color: #157347;
        }

        .btn-warning {
            background-color: #ffc107;
            color: #000;
        }

        .btn-warning:hover {
            background-color: #e0a800;
        }

        .btn i {
            margin-right: 0.5rem;
        }

        .alert {
            padding: 0.875rem;
            margin-bottom: 1rem;
            border-radius: 0.375rem;
            font-size: 0.9375rem;
        }

        .alert-success {
            background-color: #d1e7dd;
            color: #0f5132;
            border: 1px solid #badbcc;
        }

        .alert-danger {
            background-color: #f8d7da;
            color: #842029;
            border: 1px solid #f5c2c7;
        }

        .alert-info {
            background-color: #cff4fc;
            color: #055160;
            border: 1px solid #b6effb;
        }

        .section-divider {
            margin: 2.5rem 0;
            border-bottom: 1px solid #e9ecef;
        }

        h1,
        h2 {
            color: #343a40;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="text-center mb-8">
            <a href="/" class="text-sm text-blue-600 hover:underline"><i data-feather="arrow-left"
                    class="inline-block w-4 h-4"></i> Back to Chat</a>
            <h1 class="text-3xl font-semibold mt-2">Analytica AI Settings</h1>
        </div>

        <section id="db-config-section">
            <h2 class="text-xl font-medium mb-4">Database Connection</h2>
            <form id="db-config-form" class="space-y-4">
                <div><label for="db-driver" class="form-label">Driver:</label><input type="text" id="db-driver"
                        name="driver" class="form-input" value="ODBC Driver 17 for SQL Server"></div>
                <div> <label for="db-dialect" class="form-label">SQL Dialect:</label>
                    <select id="db-dialect" name="dialect" class="form-input">
                        <option value="SQL Server">Microsoft SQL Server (T-SQL)</option>
                        <option value="PostgreSQL">PostgreSQL (PL/pgSQL)</option>
                        <option value="MySQL">MySQL</option>
                    </select>
                </div>
                <div><label for="db-server" class="form-label">Server Address:</label><input type="text" id="db-server"
                        name="server" class="form-input" placeholder="localhost" required></div>
                <div><label for="db-name" class="form-label">Database Name:</label><input type="text" id="db-name"
                        name="database" class="form-input" placeholder="AdventureWorks2017" required></div>
                <div><label for="db-user" class="form-label">Username:</label><input type="text" id="db-user" name="uid"
                        class="form-input" placeholder="sa" required></div>
                <div><label for="db-password" class="form-label">Password:</label><input type="password"
                        id="db-password" name="pwd" class="form-input" placeholder="Enter password"></div>
                <div><label for="db-timeout" class="form-label">Timeout (s):</label><input type="number" id="db-timeout"
                        name="timeout" class="form-input" value="30" min="5"></div>

                <div class="flex space-x-3 pt-2">
                    <button type="button" id="test-db-connection" class="btn btn-secondary"><i data-feather="zap"></i>
                        Test</button>
                    <button type="submit" id="save-db-connection" class="btn btn-primary"><i data-feather="save"></i>
                        Save</button>
                </div>
            </form>
            <div id="db-status-message" class="mt-4"></div>
        </section>


        <div class="section-divider"></div>

        <section id="training-section">
            <h2 class="text-xl font-medium mb-4">Knowledge Base</h2>
            <p class="text-sm text-gray-600 mb-3">Build/rebuild schema embeddings for the currently saved database. This
                may take time.</p>
            <div class="flex space-x-3">
                <button type="button" id="run-training-script" class="btn btn-success">
                    <i data-feather="database" class="w-4 h-4"></i> Build/Rebuild Embeddings
                </button>
                <button type="button" id="reload-faiss-btn" class="btn btn-warning">
                    <i data-feather="refresh-ccw" class="w-4 h-4"></i> Reload Knowledge Base
                </button>
            </div>
            <div id="training-status-message" class="mt-4"></div>
            <div id="reload-status-message" class="mt-2"></div>
        </section>

        <section style="margin-top:24px">
            <h3>Select tables to include</h3>
            <div id="tables-container" style="max-height:260px; overflow:auto; border:1px solid #ddd; padding:8px;"></div>
            <button id="save-tables-btn">Save Selected Tables</button>
        </section>
    </div>

    <script>
        feather.replace();
        const dbConfigForm = document.getElementById('db-config-form');
        const testDbBtn = document.getElementById('test-db-connection');
        const dbStatusMsg = document.getElementById('db-status-message');
        const runTrainingBtn = document.getElementById('run-training-script');
        const trainingStatusMsg = document.getElementById('training-status-message');
        const reloadFaissBtn = document.getElementById('reload-faiss-btn');
        const reloadStatusMsg = document.getElementById('reload-status-message');

        function showDbStatus(message, type = 'info') {
            dbStatusMsg.innerHTML = `<div class="alert alert-${type}">${message}</div>`; feather.replace();
        }
        function showTrainingStatus(message, type = 'info') {
            trainingStatusMsg.innerHTML = `<div class="alert alert-${type}">${message}</div>`; feather.replace();
        }
        function showReloadStatus(message, type = 'info') {
            reloadStatusMsg.innerHTML = `<div class="alert alert-${type}">${message}</div>`; feather.replace();
        }

        async function loadCurrentDbConfig() {
            showDbStatus('Loading current configuration...', 'info');
            try {
                const res = await fetch('/api/settings/db/current');
                const config = await res.json();
                if (res.ok && config && config.database) {
                    document.getElementById('db-driver').value = config.driver || 'ODBC Driver 17 for SQL Server';
                    document.getElementById('db-server').value = config.server || '';
                    document.getElementById('db-name').value = config.database || '';
                    document.getElementById('db-user').value = config.uid || '';
                    document.getElementById('db-password').value = '';
                    document.getElementById('db-timeout').value = config.timeout || 30;
                    showDbStatus(`Loaded config for '${config.database}'. You can test or modify.`, 'success');
                } else {
                    showDbStatus(config.message || 'No active configuration. Please enter new details.', 'info');
                }
            } catch (error) {
                console.error("Error loading current DB config for form:", error);
                showDbStatus('Error loading config. Please enter new details.', 'danger');
            }
        }
        window.addEventListener('DOMContentLoaded', () => {
            feather.replace();
            loadCurrentDbConfig();
        });

        testDbBtn.addEventListener('click', async () => {
            const fd = new FormData(dbConfigForm); const details = Object.fromEntries(fd.entries());
            details.timeout = parseInt(details.timeout, 10);
            showDbStatus('Testing... <i data-feather="loader" class="animate-spin"></i>', 'info'); testDbBtn.disabled = true;
            try {
                const res = await fetch('/api/settings/db/test', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(details) });
                const result = await res.json();
                showDbStatus(result.message, result.status === 'success' ? 'success' : 'danger');
            } catch (e) { showDbStatus(`Error: ${e.message}`, 'danger'); }
            finally { testDbBtn.disabled = false; feather.replace(); }
        });

        dbConfigForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const fd = new FormData(dbConfigForm); const details = Object.fromEntries(fd.entries());
            details.timeout = parseInt(details.timeout, 10);
            showDbStatus('Saving... <i data-feather="loader" class="animate-spin"></i>', 'info');
            const saveBtn = dbConfigForm.querySelector('button[type="submit"]');
            saveBtn.disabled = true; testDbBtn.disabled = true;
            try {
                const res = await fetch('/api/settings/db/save', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(details) });
                const result = await res.json();
                showDbStatus(result.message, result.status === 'success' ? 'success' : 'danger');
                if (result.status === 'success') {
                    showTrainingStatus('Configuration saved. Build embeddings for this database configuration if this is a new setup or if the schema has changed.', 'info');
                }
            } catch (e) { showDbStatus(`Error: ${e.message}`, 'danger'); }
            finally { saveBtn.disabled = false; testDbBtn.disabled = false; feather.replace(); }
        });

        runTrainingBtn.addEventListener('click', async () => {
            showTrainingStatus('Initiating build... <i data-feather="loader" class="animate-spin"></i> This may take some time. Check server logs.', 'info');
            runTrainingBtn.disabled = true; reloadFaissBtn.disabled = true;
            try {
                const res = await fetch('/api/training/run', { method: 'POST' });
                const result = await res.json();
                showTrainingStatus(result.message, (res.status === 202 || result.status === 'success') ? 'info' : 'danger');
                if (res.status === 202 || result.status === 'success') { // 202 is "Accepted" for background task
                    showReloadStatus('Training initiated/completed. Reload Knowledge Base for changes to take effect in the chat.', 'info');
                }
            } catch (e) { showTrainingStatus(`Error initiating training: ${e.message}`, 'danger'); }
            finally { runTrainingBtn.disabled = false; reloadFaissBtn.disabled = false; feather.replace(); }
        });

        reloadFaissBtn.addEventListener('click', async () => {
            showReloadStatus('Reloading Knowledge Base... <i data-feather="loader" class="animate-spin"></i>', 'info');
            reloadFaissBtn.disabled = true; runTrainingBtn.disabled = true;
            try {
                const res = await fetch('/api/faiss/reload', { method: 'POST' });
                const result = await res.json();
                showReloadStatus(result.message, result.status === 'success' ? 'success' : 'danger');
            } catch (e) { showReloadStatus(`Error: ${e.message}`, 'danger'); }
            finally { reloadFaissBtn.disabled = false; runTrainingBtn.disabled = false; feather.replace(); }
        });
        //naveed edited
        async function fetchWithTimeout(url, options = {}, ms = 10000) {
            const c = new AbortController();
            const id = setTimeout(() => c.abort(), ms);
            try { return await fetch(url, { ...options, signal: c.signal }); }
            finally { clearTimeout(id); }
        }

        dbConfigForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const fd = new FormData(dbConfigForm);
            const details = Object.fromEntries(fd.entries());
            details.timeout = parseInt(details.timeout, 10);

            showDbStatus('Saving... <i data-feather="loader" class="animate-spin"></i>', 'info');
            const saveBtn = dbConfigForm.querySelector('button[type="submit"]');
            saveBtn.disabled = true; testDbBtn.disabled = true;

            try {
                const res = await fetchWithTimeout('/api/settings/db/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(details)
                }, 10000);

                const result = await res.json().catch(() => ({ message: 'Saved' }));
                showDbStatus(result.message || 'Saved. Pool is initializing in background.', 'success');
                showTrainingStatus('Next: Build embeddings if schema changed.', 'info');
            } catch (e) {
                const msg = e.name === 'AbortError'
                    ? 'Saving is taking longer than expected. Settings saved; pool will continue initializing in background.'
                    : `Error: ${e.message}`;
                showDbStatus(msg, e.name === 'AbortError' ? 'info' : 'danger');
            } finally {
                saveBtn.disabled = false; testDbBtn.disabled = false; feather.replace();
            }
        });

        // Load all available tables and mark previously saved selections.
        async function loadTables() {
        const res = await fetch('/api/settings/tables/list');
        const json = await res.json();
        const cont = document.getElementById('tables-container');
        cont.innerHTML = '';
        const selected = new Set(json.selected || []);
        (json.tables || []).forEach(t => {
            const id = 'tbl_' + t.replace(/\W/g,'_');
            cont.insertAdjacentHTML('beforeend', `
            <label style="display:block">
                <input type="checkbox" id="${id}" value="${t}" ${selected.has(t) ? 'checked' : ''}/>
                ${t}
            </label>
            `);
        });
        }

        // Persist user-selected tables for training/indexing filter
        document.getElementById('save-tables-btn').addEventListener('click', async () => {
        const boxes = [...document.querySelectorAll('#tables-container input[type=checkbox]')];
        const chosen = boxes.filter(b => b.checked).map(b => b.value);
        const res = await fetch('/api/settings/tables/save', {
            method:'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ tables: chosen })
        });
        const out = await res.json();
        alert(out.status === 'success' ? `Saved ${out.count} tables.` : 'Save failed.');
        });

        // Load table list on page open
        loadTables();
    </script>
</body>

</html>
