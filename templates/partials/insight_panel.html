<section id="insight-panel" class="card hidden" aria-live="polite">
  <div class="insight-summary text-gray-800 mb-2"></div>
  <div class="insight-meta flex items-center gap-2 mb-2">
    <span class="badge" id="confidence-badge">Confidence</span>
    <span class="provenance text-sm text-gray-600"></span>
  </div>
  <div class="flex items-center gap-2 mb-2">
    <button id="btn-explain-quick" class="px-3 py-1 border rounded">Explain in 2 sentences</button>
    <button id="btn-why" class="px-3 py-1 border rounded">Why this?</button>
    <button id="btn-download-csv" class="px-3 py-1 border rounded">Download CSV</button>
  </div>
  <canvas id="resultChart" class="hidden" height="120"></canvas>
</section>
