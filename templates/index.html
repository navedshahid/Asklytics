<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AskLytics - AI Data Analyst</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://unpkg.com/feather-icons"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="/static/js/asklytics_ui.js"></script>
    <link rel="stylesheet" href="/static/css/asklytics.css">
    <script>
    // Apply theme immediately (before render)
    (() => {
      try {
        const t = localStorage.getItem('theme') || 'blue';
        document.documentElement.classList.toggle('light-grey', t === 'light-grey');
      } catch (e) {
        console.warn('Theme load failed:', e);
      }
    })();
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--bg);
            color: var(--fg);
            height: 100vh;
            overflow: hidden;
        }

        .app-container {
            display: flex;
            height: 100vh;
            background: var(--bg);
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background: var(--sidebar-bg);
            color: white;
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
        }

        .sidebar.collapsed {
            width: 0;
            overflow: hidden;
        }

        .sidebar-header {
            padding: 1.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .sidebar-title {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 1.25rem;
            font-weight: 700;
        }

        .mobile-close-btn {
            display: none;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 0.5rem;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .mobile-close-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .new-session-btn {
            margin: 1rem;
            padding: 0.875rem;
            background: var(--primary);
            border: 1px solid var(--primary-hover);
            border-radius: 0.5rem;
            color: white;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .new-session-btn:hover {
            background: var(--primary-hover);
        }

        .chat-history {
            flex: 1;
            overflow-y: auto;
            padding: 0.5rem;
        }

        .history-item {
            padding: 0.75rem 1rem;
            margin: 0.25rem;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: all 0.2s ease;
            border-left: 3px solid transparent;
        }

        .history-item:hover {
            background: rgba(255,255,255,0.1);
        }

        .history-item.active {
            background: rgba(255,255,255,0.15);
            border-left-color: var(--primary);
        }

        .history-item-title {
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.25rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .history-item-time {
            font-size: 0.75rem;
            opacity: 0.7;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg);
        }

        .top-bar {
            background: var(--card);
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .hamburger-btn {
            display: none;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 0.375rem;
            transition: background 0.2s;
        }

        .hamburger-btn:hover {
            background: var(--card);
        }

        .db-info {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
            color: var(--muted);
        }

        .nav-links {
            display: flex;
            gap: 1rem;
        }

        .nav-link {
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            color: var(--muted);
            text-decoration: none;
            transition: all 0.2s;
            font-size: 0.875rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .nav-link:hover {
            background: var(--card);
            color: var(--primary);
        }

        /* Chat Area */
        .chat-container {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        .chat-column {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 2rem;
        }

        .message-group {
            margin-bottom: 1.5rem;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .user-message, .assistant-message {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .user-message {
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .user-message .message-avatar {
            background: var(--primary);
            color: white;
        }

        .assistant-message .message-avatar {
            background: var(--muted);
            color: white;
        }

        .message-bubble {
            max-width: 70%;
            padding: 1rem;
            border-radius: 1rem;
            background: var(--card);
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .user-message .message-bubble {
            background: var(--primary);
            color: white;
            border-bottom-right-radius: 0.25rem;
        }

        .assistant-message .message-bubble {
            background: var(--card);
            border-bottom-left-radius: 0.25rem;
        }

        .message-time {
            font-size: 0.75rem;
            opacity: 0.6;
            margin-top: 0.5rem;
        }

        .loading-dots {
            display: flex;
            gap: 0.25rem;
            padding: 0.5rem 0;
        }

        .loading-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--muted);
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .loading-dot:nth-child(1) { animation-delay: -0.32s; }
        .loading-dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* Feedback Buttons */
        .feedback-buttons {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.75rem;
        }

        .feedback-btn {
            padding: 0.375rem 0.75rem;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 0.375rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.375rem;
            font-size: 0.8125rem;
            color: var(--fg);
        }

        .feedback-btn:hover:not(:disabled) {
            background: var(--bg);
            border-color: var(--primary);
        }

        .feedback-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .feedback-btn.active.correct {
            background: var(--success);
            border-color: var(--success);
            color: white;
        }

        .feedback-btn.active.incorrect {
            background: var(--error);
            border-color: var(--error);
            color: white;
        }

        /* Results Panel */
        .results-panel {
            width: 0;
            background: var(--card);
            border-left: 1px solid var(--border);
            overflow: hidden;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .results-panel.open {
            width: 45%;
        }

        .results-header {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--card);
        }

        .results-header h3 {
            font-size: 1rem;
            font-weight: 600;
            color: var(--fg);
        }

        .close-results-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 0.375rem;
            transition: background 0.2s;
            color: var(--muted);
        }

        .close-results-btn:hover {
            background: var(--bg);
        }

        .results-tabs {
            display: flex;
            padding: 0 1.5rem;
            border-bottom: 1px solid var(--border);
            background: var(--card);
        }

        .results-tab {
            padding: 0.75rem 1rem;
            border: none;
            background: none;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--muted);
        }

        .results-tab.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }

        .results-content {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
        }

        .results-empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--muted);
            text-align: center;
        }

        /* Chat Input */
        .chat-input-container {
            padding: 1.5rem;
            background: var(--card);
            border-top: 1px solid var(--border);
        }

        .input-wrapper {
            display: flex;
            gap: 0.75rem;
            align-items: flex-end;
        }

        .chat-input {
            flex: 1;
            padding: 0.875rem 1rem;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            font-size: 0.9375rem;
            resize: none;
            max-height: 120px;
            min-height: 44px;
            transition: all 0.2s;
            background: var(--bg);
            color: var(--fg);
        }

        .chat-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .send-btn {
            padding: 0.875rem 1.25rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 44px;
        }

        .send-btn:hover:not(:disabled) {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .send-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                left: 0;
                top: 0;
                height: 100vh;
                z-index: 1000;
                transform: translateX(-100%);
            }

            .sidebar:not(.collapsed) {
                transform: translateX(0);
            }

            .mobile-close-btn {
                display: block;
            }

            .hamburger-btn {
                display: block;
            }

            .results-panel.open {
                width: 100%;
                position: fixed;
                left: 0;
                top: 0;
                height: 100vh;
                z-index: 999;
            }

            .nav-links {
                display: none;
            }

            .message-bubble {
                max-width: 85%;
            }
        }

        /* Executive Summary Styles */
        .executive-summary {
            background: var(--primary);
            border-radius: 0.75rem;
            padding: 1.5rem;
            color: white;
            margin-bottom: 1.5rem;
        }

        .summary-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
        }

        .confidence-badge {
            padding: 0.375rem 0.75rem;
            background: rgba(255,255,255,0.2);
            border-radius: 0.375rem;
            font-size: 0.8125rem;
            font-weight: 500;
        }

        .summary-text {
            font-size: 0.9375rem;
            line-height: 1.6;
            margin-bottom: 1rem;
        }

        .summary-actions {
            display: flex;
            gap: 0.75rem;
            margin-top: 1rem;
        }

        .summary-btn {
            padding: 0.5rem 1rem;
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            border-radius: 0.375rem;
            cursor: pointer;
            font-size: 0.8125rem;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.375rem;
        }

        .summary-btn:hover {
            background: rgba(255,255,255,0.3);
        }

        /* Chart Container */
        .chart-container {
            background: var(--card);
            border-radius: 0.75rem;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border: 1px solid var(--border);
        }

        .chart-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
        }

        .chart-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--fg);
        }

        .save-chart-btn {
            padding: 0.5rem 1rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 0.375rem;
            cursor: pointer;
            font-size: 0.8125rem;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.375rem;
            color: var(--fg);
        }

        .save-chart-btn:hover {
            background: var(--card);
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-title">
                    <i data-feather="bar-chart-2" class="w-6 h-6"></i>
                    <span>AskLytics</span>
                </div>
                <button class="mobile-close-btn" id="mobileCloseBtn">
                    <i data-feather="x" class="w-5 h-5"></i>
                </button>
            </div>
            
            <button class="new-session-btn" id="newSessionBtn">
                <i data-feather="plus-circle" class="w-5 h-5"></i>
                <span>New Session</span>
            </button>
            
            <div class="chat-history" id="chatHistory">
                <div class="text-sm" style="color: rgba(255,255,255,0.5); padding: 1rem; text-align: center;">No chat history</div>
            </div>
            
            <div style="padding: 1rem; border-top: 1px solid rgba(255,255,255,0.1); text-align: center; font-size: 0.75rem; opacity: 0.7;">
                Version 3.2.0
            </div>
        </aside>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Top Bar -->
            <div class="top-bar">
                <div style="display: flex; align-items: center; gap: 1rem;">
                    <button class="hamburger-btn" id="hamburgerBtn">
                        <i data-feather="menu" class="w-5 h-5"></i>
                    </button>
                    <div class="db-info">
                        <i data-feather="database" class="w-4 h-4"></i>
                        <span id="dbInfo">Loading...</span>
                    </div>
                </div>
                
                <div class="nav-links">
                    <a href="/modeling" class="nav-link">
                        <i data-feather="git-branch" class="w-4 h-4"></i>
                        Modeling
                    </a>
                    <a href="/settings" class="nav-link">
                        <i data-feather="settings" class="w-4 h-4"></i>
                        Settings
                    </a>
                    <a href="/dashboard" class="nav-link">
                        <i data-feather="activity" class="w-4 h-4"></i>
                        Dashboard
                    </a>
                </div>
            </div>

            <!-- Chat Container -->
            <div class="chat-container">
                <!-- Chat Column -->
                <div class="chat-column">
                    <div class="chat-messages" id="chatMessages">
                        <div class="results-empty">
                            <i data-feather="message-circle" class="w-16 h-16"></i>
                            <h3 style="font-size: 1.125rem; font-weight: 600; margin-top: 1rem; margin-bottom: 0.5rem;">Welcome to AskLytics</h3>
                            <p>Ask questions about your data and get instant insights</p>
                        </div>
                    </div>

                    <div class="chat-input-container">
                        <div class="input-wrapper">
                            <textarea 
                                class="chat-input" 
                                id="chatInput" 
                                placeholder="Ask about your data..."
                                rows="1"
                            ></textarea>
                            <button class="send-btn" id="sendBtn">
                                <i data-feather="send" class="w-5 h-5"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Results Panel -->
                <div class="results-panel" id="resultsPanel">
                    <div class="results-header">
                        <h3>Analysis Results</h3>
                        <button class="close-results-btn" id="closeResultsBtn">
                            <i data-feather="x" class="w-5 h-5"></i>
                        </button>
                    </div>

                    <div class="results-tabs">
                        <button class="results-tab active" data-tab="summary">Executive Summary</button>
                        <button class="results-tab" data-tab="results">Results</button>
                        <button class="results-tab" data-tab="visuals">Visuals</button>
                    </div>

                    <div class="results-content" id="resultsContent">
                        <div class="results-empty">
                            <i data-feather="bar-chart-2" class="w-12 h-12"></i>
                            <p>No results yet</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Initialize Feather Icons
        feather.replace();

        // ===== SESSION & HISTORY MANAGEMENT =====
        function safeLocalStorage(action, key, value = null) {
            try {
                if (action === 'get') return localStorage.getItem(key);
                if (action === 'set') localStorage.setItem(key, value);
                if (action === 'remove') localStorage.removeItem(key);
            } catch (e) {
                console.warn(`localStorage ${action} failed:`, e);
                return null;
            }
        }

        function getOrCreateSessionId() {
            const existing = safeLocalStorage('get', 'currentSessionId');
            if (existing) return existing;
            
            // Check for existing chat history
            try {
                const keys = Object.keys(localStorage).filter(k => k.startsWith('chatHistory_'));
                if (keys.length > 0) {
                    const sessionId = keys[0].replace('chatHistory_', '');
                    safeLocalStorage('set', 'currentSessionId', sessionId);
                    return sessionId;
                }
            } catch (e) {
                console.warn('Error checking localStorage keys:', e);
            }
            
            // Create new session
            const id = 'session_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            safeLocalStorage('set', 'currentSessionId', id);
            return id;
        }

        function saveChatHistory(arr) {
            safeLocalStorage('set', 'chatHistory_' + currentSessionId, JSON.stringify(arr || []));
        }

        function loadChatHistory() {
            try {
                const historyJson = safeLocalStorage('get', 'chatHistory_' + currentSessionId) || '[]';
                const history = JSON.parse(historyJson);
                chatHistory = history;
                
                // Render messages
                chatMessages.innerHTML = '';
                if (history.length === 0) {
                    chatMessages.innerHTML = `
                        <div class="results-empty">
                            <i data-feather="message-circle" class="w-16 h-16"></i>
                            <h3 style="font-size: 1.125rem; font-weight: 600; margin-top: 1rem; margin-bottom: 0.5rem;">Welcome to AskLytics</h3>
                            <p>Ask questions about your data and get instant insights</p>
                        </div>
                    `;
                    feather.replace();
                    return;
                }
                
                history.forEach(msg => {
                    addMessage(msg.content, msg.type, false, msg.id, msg.addFeedback || false);
                });
                
                feather.replace();
                chatMessages.scrollTop = chatMessages.scrollHeight;
            } catch (e) {
                console.error('Error loading chat history:', e);
            }
        }

        // ===== PROVENANCE RENDERER =====
        function renderProvenance(p) {
            const model = p?.model || 'Gemini';
            const sources = Array.isArray(p?.sources) ? p.sources.join(', ') : (p?.sources || 'Database Schema');
            const latency = (p?.latencyMs || '—') + (p?.latencyMs ? ' ms' : '');
            const qtime = p?.queryTime || new Date().toISOString().split('T')[0];
            
            return `
                <div class="provenance-card">
                    <div class="provenance-title">Provenance</div>
                    <div class="provenance-row"><strong>Model:</strong> ${model}</div>
                    <div class="provenance-row"><strong>Sources:</strong> ${sources}</div>
                    <div class="provenance-row"><strong>Latency:</strong> ${latency}</div>
                    <div class="provenance-row"><strong>Query Time:</strong> ${qtime}</div>
                </div>
            `;
        }

        // Global Variables
        let currentSessionId = getOrCreateSessionId();
        let currentChart = null;
        let isResultsPanelOpen = false;
        let currentTab = 'summary';
        let currentResultData = null;
        let chatHistory = [];

        // DOM Elements
        const sidebar = document.getElementById('sidebar');
        const hamburgerBtn = document.getElementById('hamburgerBtn');
        const mobileCloseBtn = document.getElementById('mobileCloseBtn');
        const newSessionBtn = document.getElementById('newSessionBtn');
        const chatMessages = document.getElementById('chatMessages');
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');
        const resultsPanel = document.getElementById('resultsPanel');
        const closeResultsBtn = document.getElementById('closeResultsBtn');
        const resultsContent = document.getElementById('resultsContent');
        const dbInfo = document.getElementById('dbInfo');

        // Sidebar Toggle
        function openSidebar() {
            sidebar.classList.remove('collapsed');
        }

        function closeSidebar() {
            if (window.innerWidth <= 768) {
                sidebar.classList.add('collapsed');
            }
        }

        hamburgerBtn.addEventListener('click', openSidebar);
        mobileCloseBtn.addEventListener('click', closeSidebar);

        // New Session
        newSessionBtn.addEventListener('click', () => {
            const id = 'session_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            currentSessionId = id;
            safeLocalStorage('set', 'currentSessionId', id);
            chatHistory = [];
            saveChatHistory([]);
            chatMessages.innerHTML = `
                <div class="results-empty">
                    <i data-feather="message-circle" class="w-16 h-16"></i>
                    <h3 style="font-size: 1.125rem; font-weight: 600; margin-top: 1rem; margin-bottom: 0.5rem;">Welcome to AskLytics</h3>
                    <p>Ask questions about your data and get instant insights</p>
                </div>
            `;
            feather.replace();
            currentResultData = null;
            if (isResultsPanelOpen) {
                toggleResultsPanel();
            }
        });

        // Results Panel Toggle
        function toggleResultsPanel() {
            isResultsPanelOpen = !isResultsPanelOpen;
            if (isResultsPanelOpen) {
                resultsPanel.classList.add('open');
            } else {
                resultsPanel.classList.remove('open');
            }
        }

        closeResultsBtn.addEventListener('click', toggleResultsPanel);

        // Tab Switching
        document.querySelectorAll('.results-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.results-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentTab = tab.dataset.tab;
                renderCurrentTab();
            });
        });

        function renderCurrentTab() {
            if (!currentResultData) return;

            switch(currentTab) {
                case 'summary':
                    renderSummaryTab();
                    break;
                case 'results':
                    renderResultsTab();
                    break;
                case 'visuals':
                    renderVisualsTab();
                    break;
            }
        }

        function renderSummaryTab() {
            const { summary, confidence, provenance, sql } = currentResultData;
            
            const confidenceLabel = confidence?.label || 'Medium';
            const summaryText = summary || 'Analysis completed successfully. Review the results in the tabs above.';
            
            resultsContent.innerHTML = `
                <div class="executive-summary">
                    <div class="summary-header">
                        <h4 style="font-size: 1.125rem; font-weight: 600;">Executive Summary</h4>
                        <span class="confidence-badge">${confidenceLabel} Confidence</span>
                    </div>
                    <div class="summary-text">${summaryText}</div>
                    <div class="summary-actions">
                        <button class="summary-btn" onclick="refreshSummary()">
                            <i data-feather="refresh-cw" class="w-3 h-3"></i>
                            Refresh Summary
                        </button>
                        <button class="summary-btn" onclick="explainWhy()">
                            <i data-feather="help-circle" class="w-3 h-3"></i>
                            Why this?
                        </button>
                    </div>
                </div>
                ${sql ? `
                <details class="sql-details">
                    <summary class="link">Show SQL Query</summary>
                    <pre style="margin-top: 0.75rem; padding: 0.75rem; background: #111827; color: #f9fafb; border-radius: 0.375rem; overflow-x: auto; font-size: 0.8125rem;">${sql}</pre>
                </details>
                ` : ''}
                ${renderProvenance(provenance || {})}
            `;
            feather.replace();
        }

        function renderResultsTab() {
            const { columns, rows } = currentResultData;
            
            if (!columns || !rows || rows.length === 0) {
                resultsContent.innerHTML = `
                    <div class="results-empty">
                        <i data-feather="info" class="w-12 h-12"></i>
                        <p>No data to display</p>
                    </div>
                `;
                feather.replace();
                return;
            }

            let html = '<div class="results-table-container"><table class="results-table"><thead><tr>';
            columns.forEach(col => {
                html += `<th>${col}</th>`;
            });
            html += '</tr></thead><tbody>';
            
            rows.forEach(row => {
                html += '<tr>';
                if (Array.isArray(row)) {
                    row.forEach(cell => {
                        html += `<td>${cell !== null && cell !== undefined ? cell : 'NULL'}</td>`;
                    });
                } else {
                    columns.forEach(col => {
                        const cell = row[col];
                        html += `<td>${cell !== null && cell !== undefined ? cell : 'NULL'}</td>`;
                    });
                }
                html += '</tr>';
            });
            
            html += '</tbody></table></div>';
            html += `
                <div style="margin-top: 1rem; display: flex; justify-content: space-between; align-items: center;">
                    <span style="font-size: 0.875rem; color: var(--muted);">${rows.length} rows × ${columns.length} columns</span>
                    <button class="summary-btn" onclick="downloadCSV()" style="background: var(--card); color: var(--fg); border: 1px solid var(--border);">
                        <i data-feather="download" class="w-3 h-3"></i>
                        Download CSV
                    </button>
                </div>
            `;
            
            resultsContent.innerHTML = html;
            feather.replace();
        }

        function renderVisualsTab() {
            const { columns, rows } = currentResultData;
            
            if (!columns || !rows || rows.length === 0 || columns.length < 2) {
                resultsContent.innerHTML = `
                    <div class="results-empty">
                        <i data-feather="bar-chart-2" class="w-12 h-12"></i>
                        <p>No chart data available</p>
                        <p style="font-size: 0.875rem; margin-top: 0.5rem;">Need at least 2 columns to visualize</p>
                    </div>
                `;
                feather.replace();
                return;
            }

            resultsContent.innerHTML = `
                <div class="chart-container">
                    <div class="chart-header">
                        <div class="chart-title">Data Visualization</div>
                        <button class="save-chart-btn" onclick="saveChart()">
                            <i data-feather="download" class="w-3 h-3"></i>
                            Save Image
                        </button>
                    </div>
                    <canvas id="resultChart" width="400" height="250"></canvas>
                </div>
            `;
            feather.replace();
            
            createChart({columns, rows});
        }

        function createChart(data) {
            if (currentChart) {
                currentChart.destroy();
            }
            
            const ctx = document.getElementById('resultChart');
            if (!ctx) return;
            
            const labels = [];
            const values = [];
            
            data.rows.slice(0, 10).forEach(row => {
                if (Array.isArray(row)) {
                    labels.push(String(row[0] || ''));
                    values.push(parseFloat(row[1]) || 0);
                } else {
                    const cols = Object.keys(row);
                    labels.push(String(row[cols[0]] || ''));
                    values.push(parseFloat(row[cols[1]]) || 0);
                }
            });
            
            currentChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: data.columns[1] || 'Value',
                        data: values,
                        backgroundColor: getComputedStyle(document.documentElement).getPropertyValue('--primary'),
                        borderColor: getComputedStyle(document.documentElement).getPropertyValue('--primary'),
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });
        }

        // Auto-resize textarea
        chatInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = this.scrollHeight + 'px';
        });

        // Keyboard UX: Enter to submit, Shift+Enter for newline
        chatInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        sendBtn.addEventListener('click', sendMessage);

        async function sendMessage() {
            const message = chatInput.value.trim();
            if (!message || sendBtn.disabled) return;
            
            sendBtn.disabled = true;
            sendBtn.innerHTML = '<i data-feather="loader" class="w-5 h-5"></i>';
            feather.replace();
            
            chatInput.value = '';
            chatInput.style.height = 'auto';
            
            const userMsgId = addMessage(message, 'user');
            chatHistory.push({ id: userMsgId, type: 'user', content: message, addFeedback: false });
            saveChatHistory(chatHistory);
            
            const loadingId = addMessage('', 'assistant', true);
            
            try {
                const inferenceMode = safeLocalStorage('get', 'inferenceMode') || 'gemini';
                const apiEndpoint = inferenceMode === 'sqlcoder' ? '/api/ask/stream' : '/api/gemini_ask/stream';
                
                const response = await fetch(apiEndpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: message, session_id: currentSessionId })
                });
                
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let assistantMessage = '';
                let tempResultData = { columns: [], rows: [], summary: '', confidence: null, provenance: {}, sql: '' };
                
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n');
                    
                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            try {
                                const event = JSON.parse(line.slice(6));
                                
                                switch(event.type) {
                                    case 'semantic_match':
                                        // Show semantic match notification
                                        assistantMessage = `✨ Using pre-compiled metric: ${event.data.metric}`;
                                        updateMessage(loadingId, assistantMessage, 'assistant');
                                        tempResultData.semantic_context = {
                                            metric: event.data.metric,
                                            description: event.data.description,
                                            score: event.data.score
                                        };
                                        break;
                                    
                                    case 'sql_complete':
                                        tempResultData.sql = event.data.query;
                                        assistantMessage = 'Query generated. Executing...';
                                        updateMessage(loadingId, assistantMessage, 'assistant');
                                        break;
                                    
                                    case 'executing':
                                        assistantMessage = 'Executing query...';
                                        updateMessage(loadingId, assistantMessage, 'assistant');
                                        break;
                                    
                                    case 'result':
                                        assistantMessage = '✓ Query completed successfully';
                                        updateMessage(loadingId, assistantMessage, 'assistant');
                                        tempResultData.columns = event.data.columns || [];
                                        tempResultData.rows = event.data.data || [];
                                        break;
                                    
                                    case 'explanation':
                                        tempResultData.summary = event.data.summary || '';
                                        tempResultData.confidence = event.data.confidence;
                                        tempResultData.provenance = event.data.provenance || {};
                                        break;
                                    
                                    case 'summary':
                                        if (!tempResultData.summary) {
                                            tempResultData.summary = event.data.text;
                                        }
                                        break;
                                    
                                    case 'error':
                                        assistantMessage = `Error: ${event.data.message || 'Unknown error occurred'}`;
                                        updateMessage(loadingId, assistantMessage, 'assistant');
                                        break;
                                    
                                    case 'done':
                                        if (tempResultData.columns.length > 0 || tempResultData.summary) {
                                            currentResultData = tempResultData;
                                            if (!isResultsPanelOpen) toggleResultsPanel();
                                            currentTab = 'summary';
                                            document.querySelectorAll('.results-tab').forEach(t => t.classList.remove('active'));
                                            document.querySelector('[data-tab="summary"]').classList.add('active');
                                            renderSummaryTab();
                                        }
                                        break;
                                }
                            } catch (e) {
                                console.error('Error parsing SSE data:', e);
                            }
                        }
                    }
                }
                
                removeMessage(loadingId);
                
                if (assistantMessage) {
                    const assistantMsgId = addMessage(assistantMessage, 'assistant', false, null, true);
                    chatHistory.push({ id: assistantMsgId, type: 'assistant', content: assistantMessage, addFeedback: true });
                    saveChatHistory(chatHistory);
                }
                
            } catch (error) {
                console.error('Error sending message:', error);
                removeMessage(loadingId);
                const errorMsgId = addMessage('Sorry, I encountered an error. Please try again.', 'assistant');
                chatHistory.push({ id: errorMsgId, type: 'assistant', content: 'Sorry, I encountered an error. Please try again.', addFeedback: false });
                saveChatHistory(chatHistory);
            } finally {
                sendBtn.disabled = false;
                sendBtn.innerHTML = '<i data-feather="send" class="w-5 h-5"></i>';
                feather.replace();
            }
        }

        function addMessage(content, type, isLoading = false, messageId = null, addFeedback = false) {
            if (!messageId) {
                messageId = 'msg_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            }

            const messageGroup = document.createElement('div');
            messageGroup.className = 'message-group';
            messageGroup.id = messageId;

            const messageDiv = document.createElement('div');
            messageDiv.className = `${type}-message`;

            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.innerHTML = type === 'user' ? 
                '<i data-feather="user" class="w-4 h-4"></i>' : 
                '<i data-feather="cpu" class="w-4 h-4"></i>';

            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';

            if (isLoading) {
                bubble.innerHTML = '<div class="loading-dots"><div class="loading-dot"></div><div class="loading-dot"></div><div class="loading-dot"></div></div>';
            } else {
                bubble.innerHTML = `<div style="white-space: pre-wrap;">${content}</div>`;
                
                const timeDiv = document.createElement('div');
                timeDiv.className = 'message-time';
                timeDiv.textContent = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                bubble.appendChild(timeDiv);
                
                if (type === 'assistant' && !isLoading && addFeedback) {
                    const feedbackDiv = document.createElement('div');
                    feedbackDiv.className = 'feedback-buttons';
                    feedbackDiv.innerHTML = `
                        <button class="feedback-btn" onclick="submitFeedback('${messageId}', 'correct')">
                            <i data-feather="thumbs-up" class="w-3 h-3"></i>
                            <span>Correct</span>
                        </button>
                        <button class="feedback-btn" onclick="submitFeedback('${messageId}', 'incorrect')">
                            <i data-feather="thumbs-down" class="w-3 h-3"></i>
                            <span>Incorrect</span>
                        </button>
                    `;
                    bubble.appendChild(feedbackDiv);
                }
            }

            messageDiv.appendChild(avatar);
            messageDiv.appendChild(bubble);
            messageGroup.appendChild(messageDiv);

            const emptyState = chatMessages.querySelector('.results-empty');
            if (emptyState) emptyState.remove();

            chatMessages.appendChild(messageGroup);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            feather.replace();
            return messageId;
        }

        function updateMessage(messageId, content, type) {
            const messageGroup = document.getElementById(messageId);
            if (messageGroup) {
                const bubble = messageGroup.querySelector('.message-bubble');
                if (bubble) {
                    bubble.innerHTML = `<div style="white-space: pre-wrap;">${content}</div>`;
                }
            }
        }

        function removeMessage(messageId) {
            const messageGroup = document.getElementById(messageId);
            if (messageGroup) messageGroup.remove();
        }

        // Feedback submission
        async function submitFeedback(messageId, verdict) {
            try {
                const response = await fetch('/api/feedback', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        session_id: currentSessionId,
                        message_id: messageId,
                        verdict: verdict,
                        userId: safeLocalStorage('get', 'userEmail') || 'anonymous',
                        theme: safeLocalStorage('get', 'theme') || 'blue',
                        timestamp: new Date().toISOString()
                    })
                });

                if (response.ok) {
                    const messageGroup = document.getElementById(messageId);
                    if (messageGroup) {
                        const buttons = messageGroup.querySelectorAll('.feedback-btn');
                        buttons.forEach(btn => {
                            btn.classList.remove('active', 'correct', 'incorrect');
                            btn.disabled = true;
                        });

                        const clickedBtn = messageGroup.querySelector(`[onclick*="${verdict}"]`);
                        if (clickedBtn) {
                            clickedBtn.classList.add('active', verdict);
                        }
                        
                        // Show thanks message
                        const bubble = messageGroup.querySelector('.message-bubble');
                        const thanksDiv = document.createElement('div');
                        thanksDiv.style.cssText = 'margin-top: 0.5rem; font-size: 0.75rem; opacity: 0.8;';
                        thanksDiv.textContent = 'Thanks for your feedback!';
                        bubble.appendChild(thanksDiv);
                    }
                }
            } catch (error) {
                console.error('Error submitting feedback:', error);
            }
        }

        // Utility functions
        function refreshSummary() {
            if (!currentResultData) return;
            renderSummaryTab();
        }

        function explainWhy() {
            if (!currentResultData) return;
            alert('This analysis is based on:\n\n' + 
                  '• SQL Query execution\n' +
                  '• Data patterns identified\n' +
                  '• ' + (currentResultData.provenance?.sources || 'Query result analysis'));
        }

        function downloadCSV() {
            if (!currentResultData || !currentResultData.columns || !currentResultData.rows) {
                alert('No data to download');
                return;
            }

            let csv = currentResultData.columns.join(',') + '\n';
            currentResultData.rows.forEach(row => {
                if (Array.isArray(row)) {
                    csv += row.map(cell => `"${cell}"`).join(',') + '\n';
                } else {
                    csv += currentResultData.columns.map(col => `"${row[col]}"`).join(',') + '\n';
                }
            });

            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'results_' + new Date().toISOString().split('T')[0] + '.csv';
            a.click();
        }

        function saveChart() {
            if (currentChart) {
                const url = currentChart.toBase64Image();
                const a = document.createElement('a');
                a.href = url;
                a.download = 'chart_' + new Date().toISOString().split('T')[0] + '.png';
                a.click();
            }
        }

        // Load database info
        async function loadDatabaseInfo() {
            try {
                const response = await fetch('/api/settings/db/current');
                const data = await response.json();
                dbInfo.textContent = data.database || 'Unknown Database';
            } catch (error) {
                console.error('Error loading database info:', error);
                dbInfo.textContent = 'Database Error';
            }
        }

        // Initialize on DOMContentLoaded
        document.addEventListener('DOMContentLoaded', () => {
            loadDatabaseInfo();
            loadChatHistory();
            feather.replace();
        });

        // Handle window resize
        window.addEventListener('resize', function() {
            if (window.innerWidth > 768) {
                sidebar.classList.add('collapsed');
            }
        });
    </script>
</body>
</html>
